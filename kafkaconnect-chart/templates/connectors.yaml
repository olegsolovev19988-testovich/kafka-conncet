apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: postgres-source
  namespace: kafka-sa
  labels:
    strimzi.io/cluster: {{ .Values.name }}
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: postgres
    database.port: 5432