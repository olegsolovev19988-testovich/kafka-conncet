# Ссылки на Vault — сами секреты в git НЕ хранятся.
# External Secrets Operator / Vault Agent Injector синхронизирует их в Kubernetes Secret.
#
# Целевой K8s Secret (используется в connector.yaml):
#   name: debezium-opws-postgres
#   namespace: kafka-connect
#   keys: username, password

vault:
  address: https://vault.example.com:8200
  auth:
    method: kubernetes
    role: kafka-connect_debezium-opws-postgres
  secret:
    mount: secret
    path: kubernetes/kafka-connect/debezium-opws-postgres
    keys:
      - vault_key: db_username
        k8s_key: username
      - vault_key: db_password
        k8s_key: password
