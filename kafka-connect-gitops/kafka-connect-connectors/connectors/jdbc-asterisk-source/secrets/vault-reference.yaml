vault:
  address: https://vault.example.com:8200
  auth:
    method: kubernetes
    role: kafka-connect_jdbc-asterisk-source
  secret:
    mount: secret
    path: kubernetes/kafka-connect/jdbc-asterisk-source
    keys:
      - vault_key: db_username
        k8s_key: username
      - vault_key: db_password
        k8s_key: password

