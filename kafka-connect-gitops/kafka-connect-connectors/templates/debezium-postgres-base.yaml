# Шаблон KafkaConnector для Debezium PostgreSQL CDC.
# Скопируйте в connectors/<имя-коннектора>/connector.yaml и замените плейсхолдеры.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: CHANGE_ME-connector-name
  labels:
    strimzi.io/cluster: connect-cluster
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: CHANGE_ME-db-host
    database.port: "5432"
    database.user: ${secrets:CHANGE_ME-namespace/CHANGE_ME-secret:username}
    database.password: ${secrets:CHANGE_ME-namespace/CHANGE_ME-secret:password}
    database.dbname: CHANGE_ME-dbname
    topic.prefix: CHANGE_ME-topic-prefix
    plugin.name: pgoutput
    slot.name: CHANGE_ME_slot
    publication.name: CHANGE_ME_publication
    schema.include.list: public
    tombstones.on.delete: "false"
    snapshot.mode: initial
