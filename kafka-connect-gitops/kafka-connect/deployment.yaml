apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  labels:
    app: kafka-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-connect
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: kafka-connect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/scheme: http
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kafka-connect
                topologyKey: kubernetes.io/hostname
      containers:
        - name: kafka-connect
          image: confluentinc/cp-kafka-connect:7.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 8083
            - name: jmx
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: kafka-connect-config
          env:
            - name: KAFKA_JMX_PORT
              value: "9101"
            - name: KAFKA_JMX_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          startupProbe:
            httpGet:
              path: /connector-plugins/
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /connector-plugins/
              port: rest
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /connector-plugins/
              port: rest
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
